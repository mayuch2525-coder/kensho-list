<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>懸賞応募一覧</title>
  <meta name="description" content="懸賞の応募記録と当選結果の一覧">
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='12' fill='%23c43c2c'/><text x='32' y='44' text-anchor='middle' font-size='36' fill='white'>賞</text></svg>">
  <style>
    :root {
      --bg: #f3eee4;
      --bg-tint: #e7dfd0;
      --surface: #fffcf6;
      --ink: #1f1a16;
      --muted: #6a6158;
      --line: #e3d8c8;
      --line-strong: #cfc3b0;
      --seal: #c43c2c;
      --seal-soft: #f8e8e5;
      --won-bg: #e8f4df;
      --won-ink: #215c16;
      --lost-bg: #eeebe6;
      --lost-ink: #5a544c;
      --pending-bg: #fff1d4;
      --pending-ink: #8a5400;
      --shadow: 0 10px 30px rgba(60, 42, 20, 0.06);
      --radius: 16px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic UI", "Yu Gothic", Meiryo, sans-serif;
      background:
        radial-gradient(1200px 500px at 10% -10%, #fff8ea 0%, transparent 55%),
        radial-gradient(900px 400px at 100% 0%, #efe4d4 0%, transparent 50%),
        var(--bg);
      color: var(--ink);
      line-height: 1.65;
      min-height: 100vh;
    }
    .wrap { width: min(1120px, calc(100% - 32px)); margin: 0 auto; padding: 36px 0 72px; }
    header.hero { margin-bottom: 28px; }
    .kicker {
      display: inline-flex; align-items: center; gap: 8px;
      font-size: 12px; letter-spacing: 0.18em; color: var(--seal);
      font-weight: 700;
    }
    .kicker::before {
      content: ""; width: 18px; height: 18px; border: 1.5px solid var(--seal);
      border-radius: 50%; display: inline-block;
      background: radial-gradient(circle at 50% 50%, transparent 5px, var(--seal) 5.5px, var(--seal) 7px, transparent 7.5px);
    }
    h1 {
      font-family: "Hiragino Mincho ProN", "Yu Mincho", "YuMincho", "Noto Serif JP", serif;
      font-weight: 600; font-size: clamp(28px, 5vw, 42px);
      letter-spacing: 0.06em; margin: 10px 0 8px; line-height: 1.3;
    }
    .lede { color: var(--muted); margin: 0 0 8px; font-size: 15px; }
    .updated { color: var(--muted); font-size: 13px; }
    .cards {
      display: grid; gap: 12px;
      grid-template-columns: repeat(4, 1fr);
      margin: 24px 0 20px;
    }
    .card {
      background: var(--surface); border: 1px solid var(--line);
      border-radius: var(--radius); padding: 16px 18px; box-shadow: var(--shadow);
    }
    .card .label { font-size: 12px; color: var(--muted); letter-spacing: 0.04em; }
    .card .value { font-size: 30px; font-weight: 700; letter-spacing: 0.02em; margin-top: 4px; line-height: 1.2; }
    .card .value small { font-size: 14px; font-weight: 500; color: var(--muted); margin-left: 2px; }
    .card.sites .value { font-size: 15px; font-weight: 600; display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .site-chip {
      background: var(--bg-tint); border-radius: 999px; padding: 4px 10px;
      font-size: 13px; font-weight: 600;
    }
    .site-chip b { font-variant-numeric: tabular-nums; }
    .toolbar {
      display: flex; flex-wrap: wrap; gap: 10px; align-items: end;
      margin: 8px 0 14px;
    }
    .field { display: flex; flex-direction: column; gap: 4px; min-width: 160px; }
    .field.grow { flex: 1; min-width: min(100%, 220px); }
    .field label { font-size: 12px; color: var(--muted); }
    input[type="search"], select {
      appearance: none; border: 1px solid var(--line-strong); background: var(--surface);
      border-radius: 10px; padding: 9px 12px; font: inherit; color: var(--ink); width: 100%;
    }
    input[type="search"]:focus, select:focus { outline: 2px solid rgba(196, 60, 44, 0.35); border-color: var(--seal); }
    .count { margin-left: auto; color: var(--muted); font-size: 13px; padding-bottom: 8px; }
    .panel {
      background: var(--surface); border: 1px solid var(--line);
      border-radius: 20px; box-shadow: var(--shadow); overflow: hidden;
    }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { padding: 12px 14px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--line); }
    th {
      font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: 0.04em;
      background: #faf6ef; white-space: nowrap; cursor: pointer; user-select: none;
      position: sticky; top: 0;
    }
    th:hover { color: var(--ink); }
    th .arrow { margin-left: 4px; color: var(--seal); }
    tr:last-child td { border-bottom: 0; }
    tbody tr:hover { background: #fbf6ed; }
    .num { font-variant-numeric: tabular-nums; white-space: nowrap; }
    .muted { color: var(--muted); }
    .badge {
      display: inline-block; border-radius: 999px; padding: 2px 10px;
      font-size: 12px; font-weight: 700; letter-spacing: 0.04em; white-space: nowrap;
    }
    .badge.当選 { background: var(--won-bg); color: var(--won-ink); }
    .badge.落選 { background: var(--lost-bg); color: var(--lost-ink); }
    .badge.未発表 { background: var(--pending-bg); color: var(--pending-ink); }
    .mobile-list { display: none; }
    .mcard {
      padding: 16px 16px 14px; border-bottom: 1px solid var(--line);
    }
    .mcard:last-child { border-bottom: 0; }
    .mcard-top { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
    .mcard h2 { font-size: 16px; margin: 0 0 6px; line-height: 1.4; font-weight: 700; }
    .meta { color: var(--muted); font-size: 13px; display: flex; flex-wrap: wrap; gap: 8px 14px; }
    .empty, .error {
      padding: 36px 20px; text-align: center; color: var(--muted);
    }
    .error { color: var(--seal); }
    footer { margin-top: 22px; color: var(--muted); font-size: 12px; }
    @media (max-width: 860px) {
      .cards { grid-template-columns: repeat(2, 1fr); }
      .table-wrap { display: none; }
      .mobile-list { display: block; }
    }
    @media (max-width: 520px) {
      .wrap { width: min(1120px, calc(100% - 20px)); padding-top: 22px; }
      .cards { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="hero">
      <div class="kicker">KENSHO LIST</div>
      <h1>懸賞応募一覧</h1>
      <p class="lede">応募した懸賞と、当選・落選・未発表の結果をまとめています。</p>
      <p class="updated" id="updated">最終更新を読み込み中…</p>
    </header>

    <section class="cards" aria-label="集計">
      <article class="card"><div class="label">総応募数</div><div class="value" id="stat-total">—</div></article>
      <article class="card"><div class="label">当選数</div><div class="value" id="stat-won">—</div></article>
      <article class="card"><div class="label">未発表数</div><div class="value" id="stat-pending">—</div></article>
      <article class="card sites"><div class="label">サイト別件数</div><div class="value" id="stat-sites">—</div></article>
    </section>

    <div class="toolbar">
      <div class="field">
        <label for="filter-site">サイト</label>
        <select id="filter-site"><option value="">すべて</option></select>
      </div>
      <div class="field">
        <label for="filter-result">当選結果</label>
        <select id="filter-result">
          <option value="">すべて</option>
          <option value="未発表">未発表</option>
          <option value="当選">当選</option>
          <option value="落選">落選</option>
        </select>
      </div>
      <div class="field grow">
        <label for="filter-q">検索</label>
        <input type="search" id="filter-q" placeholder="賞品名、メモ、日付など" autocomplete="off">
      </div>
      <div class="count" id="visible-count"></div>
    </div>

    <div class="panel" id="panel">
      <div class="table-wrap">
        <table>
          <thead>
            <tr id="thead"></tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
      <div class="mobile-list" id="mobile-list"></div>
    </div>

    <footer>データは同じリポジトリの CSV から読み込んでいます。個人情報は掲載していません。</footer>
  </div>

  <script>
    const COLUMNS = [
      { key: "応募日", label: "応募日", sort: "date" },
      { key: "サイト", label: "サイト", sort: "text" },
      { key: "賞品", label: "賞品", sort: "text" },
      { key: "口数", label: "口数", sort: "number" },
      { key: "使用(メダル等)", label: "使用", sort: "text" },
      { key: "応募状況", label: "応募状況", sort: "text" },
      { key: "抽選日/発表日", label: "抽選日 / 発表日", sort: "date" },
      { key: "当選結果", label: "当選結果", sort: "text" },
      { key: "メモ", label: "メモ", sort: "text" },
    ];

    let rows = [];
    let sortKey = "応募日";
    let sortDir = "desc";

    const $ = (id) => document.getElementById(id);

    function parseCsv(text) {
      const lines = text.replace(/^\uFEFF/, "").replace(/\r\n/g, "\n").replace(/\r/g, "\n").split("\n");
      const records = [];
      for (const line of lines) {
        if (!line.trim()) continue;
        const rec = [];
        let cur = "";
        let inQ = false;
        for (let i = 0; i < line.length; i++) {
          const ch = line[i];
          if (inQ) {
            if (ch === '"') {
              if (line[i + 1] === '"') { cur += '"'; i++; }
              else inQ = false;
            } else cur += ch;
          } else if (ch === '"') inQ = true;
          else if (ch === ",") { rec.push(cur); cur = ""; }
          else cur += ch;
        }
        rec.push(cur);
        records.push(rec.map((c) => c.trim()));
      }
      if (!records.length) return [];
      const header = records[0];
      return records.slice(1).map((cols) => {
        const obj = {};
        header.forEach((h, i) => { obj[h] = cols[i] ?? ""; });
        return obj;
      }).filter((r) => r["応募日"] || r["賞品"]);
    }

    function fmtDate(s) {
      const m = String(s || "").match(/^(\d{4})-(\d{2})-(\d{2})$/);
      if (!m) return s || "—";
      return `${m[1]}年${Number(m[2])}月${Number(m[3])}日`;
    }
    function dash(s) { return (s && String(s).trim()) ? s : "—"; }
    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;")
        .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }
    function badge(result) {
      const r = result || "未発表";
      const cls = (r === "当選" || r === "落選" || r === "未発表") ? r : "未発表";
      return `<span class="badge ${cls}">${escapeHtml(r)}</span>`;
    }

    function compare(a, b, key, type, dir) {
      const av = (a[key] || "").trim();
      const bv = (b[key] || "").trim();
      let cmp = 0;
      if (type === "number") cmp = (Number(av) || 0) - (Number(bv) || 0);
      else if (type === "date") cmp = av.localeCompare(bv);
      else cmp = av.localeCompare(bv, "ja");
      if (cmp === 0) {
        cmp = (a["応募日"] || "").localeCompare(b["応募日"] || "");
        if (cmp === 0) cmp = (a["サイト"] || "").localeCompare(b["サイト"] || "", "ja");
      }
      return dir === "asc" ? cmp : -cmp;
    }

    function filtered() {
      const site = $("filter-site").value;
      const result = $("filter-result").value;
      const q = $("filter-q").value.trim().toLowerCase();
      const col = COLUMNS.find((c) => c.key === sortKey) || COLUMNS[0];
      return rows
        .filter((r) => !site || r["サイト"] === site)
        .filter((r) => !result || r["当選結果"] === result)
        .filter((r) => {
          if (!q) return true;
          return COLUMNS.some((c) => String(r[c.key] || "").toLowerCase().includes(q));
        })
        .sort((a, b) => compare(a, b, col.key, col.sort, sortDir));
    }

    function renderStats() {
      const total = rows.length;
      const won = rows.filter((r) => r["当選結果"] === "当選").length;
      const pending = rows.filter((r) => r["当選結果"] === "未発表" || !r["当選結果"]).length;
      const lost = rows.filter((r) => r["当選結果"] === "落選").length;
      $("stat-total").innerHTML = `${total}<small>件</small>`;
      $("stat-won").innerHTML = `${won}<small>件</small>`;
      $("stat-pending").innerHTML = `${pending}<small>件</small>`;
      const sites = {};
      for (const r of rows) sites[r["サイト"] || "不明"] = (sites[r["サイト"] || "不明"] || 0) + 1;
      $("stat-sites").innerHTML = Object.entries(sites)
        .sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], "ja"))
        .map(([name, n]) => `<span class="site-chip">${escapeHtml(name)} <b>${n}</b></span>`)
        .join("") || "—";
      const siteSel = $("filter-site");
      const current = siteSel.value;
      const names = Object.keys(sites).sort((a, b) => a.localeCompare(b, "ja"));
      siteSel.innerHTML = `<option value="">すべて</option>` + names.map((s) => `<option value="${escapeHtml(s)}">${escapeHtml(s)}</option>`).join("");
      if (names.includes(current)) siteSel.value = current;
    }

    function renderTable() {
      const list = filtered();
      $("thead").innerHTML = COLUMNS.map((c) => {
        const arrow = c.key === sortKey ? (sortDir === "asc" ? "▲" : "▼") : "";
        return `<th scope="col" data-key="${c.key}" aria-sort="${c.key === sortKey ? (sortDir === "asc" ? "ascending" : "descending") : "none"}">${c.label}<span class="arrow">${arrow}</span></th>`;
      }).join("");
      if (!list.length) {
        $("tbody").innerHTML = `<tr><td colspan="${COLUMNS.length}" class="empty">該当する応募はありません。</td></tr>`;
        $("mobile-list").innerHTML = `<div class="empty">該当する応募はありません。</div>`;
        $("visible-count").textContent = rows.length ? "0件表示" : "";
        return;
      }
      $("tbody").innerHTML = list.map((r) => `<tr>
        <td class="num">${escapeHtml(fmtDate(r["応募日"]))}</td>
        <td>${escapeHtml(r["サイト"] || "—")}</td>
        <td>${escapeHtml(r["賞品"] || "—")}</td>
        <td class="num">${r["口数"] ? escapeHtml(r["口数"]) + "口" : "—"}</td>
        <td>${escapeHtml(dash(r["使用(メダル等)"]))}</td>
        <td>${escapeHtml(dash(r["応募状況"]))}</td>
        <td class="num">${escapeHtml(fmtDate(r["抽選日/発表日"]))}</td>
        <td>${badge(r["当選結果"])}</td>
        <td class="muted">${escapeHtml(dash(r["メモ"]))}</td>
      </tr>`).join("");
      $("mobile-list").innerHTML = list.map((r) => `<article class="mcard">
        <div class="mcard-top">
          <h2>${escapeHtml(r["賞品"] || "—")}</h2>
          ${badge(r["当選結果"])}
        </div>
        <div class="meta">
          <span>${escapeHtml(r["サイト"] || "")}</span>
          <span>応募 ${escapeHtml(fmtDate(r["応募日"]))}</span>
          <span>${r["口数"] ? escapeHtml(r["口数"]) + "口" : ""}</span>
          <span>${escapeHtml(dash(r["使用(メダル等)"]))}</span>
          <span>抽選 ${escapeHtml(fmtDate(r["抽選日/発表日"]))}</span>
          <span>${escapeHtml(dash(r["応募状況"]))}</span>
        </div>
        ${r["メモ"] ? `<div class="meta" style="margin-top:6px">${escapeHtml(r["メモ"])}</div>` : ""}
      </article>`).join("");
      $("visible-count").textContent = list.length === rows.length ? `${list.length}件` : `${list.length} / ${rows.length}件`;
    }

    function render() { renderStats(); renderTable(); }

    $("filter-site").addEventListener("change", renderTable);
    $("filter-result").addEventListener("change", renderTable);
    $("filter-q").addEventListener("input", renderTable);
    $("thead").addEventListener("click", (e) => {
      const th = e.target.closest("th");
      if (!th) return;
      const key = th.dataset.key;
      if (sortKey === key) sortDir = sortDir === "asc" ? "desc" : "asc";
      else { sortKey = key; sortDir = key === "応募日" || key === "抽選日/発表日" ? "desc" : "asc"; }
      renderTable();
    });

    async function boot() {
      try {
        const [csvRes, metaRes] = await Promise.all([
          fetch("data/entries.csv", { cache: "no-store" }),
          fetch("data/updated.json", { cache: "no-store" }),
        ]);
        if (!csvRes.ok) throw new Error("CSV を読み込めませんでした");
        rows = parseCsv(await csvRes.text());
        if (metaRes.ok) {
          const meta = await metaRes.json();
          const tz = meta.timezone === "Asia/Tokyo" ? "日本時間" : (meta.timezone || "");
          $("updated").textContent = meta.updated ? `最終更新: ${meta.updated}（${tz}）` : "";
        } else {
          $("updated").textContent = "";
        }
        render();
      } catch (err) {
        $("updated").textContent = "";
        $("panel").innerHTML = `<div class="error">データの読み込みに失敗しました。時間をおいて再度お試しください。</div>`;
        console.error(err);
      }
    }
    boot();
  </script>
</body>
</html>
